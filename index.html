<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>SurgeryPrep – OP-Vorbereitung</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Modernes, buntes, glassmorphism-inspiriertes Design -->
  <style>
    :root {
      color-scheme: dark light;
      --bg: radial-gradient(circle at top, #020617 0, #020617 24%, #020617 48%, #020617 100%);
      --bg-plain: #020617;
      --glass: rgba(15, 23, 42, 0.78);
      --glass-strong: rgba(15, 23, 42, 0.92);
      --glass-soft: rgba(15, 23, 42, 0.70);
      --glass-border: rgba(148, 163, 184, 0.42);
      --accent-cyan: #06b6d4;
      --accent-sky: #0ea5e9;
      --accent-lime: #a3e635;
      --accent-green: #22c55e;
      --accent-pink: #ec4899;
      --accent-orange: #fb923c;
      --accent-danger: #f97373;
      --text-main: #e5e7eb;
      --text-soft: #cbd5f5;
      --text-muted: #9ca3af;
      --shadow-deep: 0 28px 80px rgba(15, 23, 42, 0.98);
      --shadow-soft: 0 18px 48px rgba(15, 23, 42, 0.85);
      --shadow-subtle: 0 0 0 1px rgba(148, 163, 184, 0.55);
      --radius-xl: 26px;
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-pill: 999px;
      --blur-strong: 26px;
      --blur-soft: 16px;
      --transition-fast: 0.16s ease-out;
      --transition-med: 0.22s ease-out;
      --font-main: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    }

    [data-theme="light"] {
      --bg: radial-gradient(circle at top, #e0f2fe 0, #eff6ff 32%, #f9fafb 100%);
      --bg-plain: #f9fafb;
      --glass: rgba(255, 255, 255, 0.82);
      --glass-strong: rgba(255, 255, 255, 0.96);
      --glass-soft: rgba(255, 255, 255, 0.68);
      --glass-border: rgba(148, 163, 184, 0.58);
      --text-main: #020617;
      --text-soft: #0f172a;
      --text-muted: #6b7280;
      --shadow-deep: 0 24px 60px rgba(15, 23, 42, 0.14);
      --shadow-soft: 0 16px 40px rgba(15, 23, 42, 0.12);
      --shadow-subtle: 0 0 0 1px rgba(148, 163, 184, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: var(--font-main);
      background: var(--bg);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      position: relative;
      overflow-x: hidden;
    }

    /* Bunte Hintergrund-Orbs */
    .orb {
      position: fixed;
      border-radius: 999px;
      filter: blur(40px);
      opacity: 0.65;
      pointer-events: none;
      z-index: 0;
    }
    .orb--cyan {
      width: 320px;
      height: 320px;
      top: -120px;
      left: -110px;
      background: radial-gradient(circle at 30% 20%, rgba(56,189,248,0.75), transparent 60%);
    }
    .orb--pink {
      width: 280px;
      height: 280px;
      bottom: 40px;
      right: -80px;
      background: radial-gradient(circle at 70% 40%, rgba(244,114,182,0.68), transparent 60%);
    }
    .orb--lime {
      width: 220px;
      height: 220px;
      bottom: 320px;
      left: 60%;
      background: radial-gradient(circle at 40% 60%, rgba(190,242,100,0.6), transparent 65%);
    }

    #app-root {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      max-width: 520px;
      margin: 0 auto;
      padding: 14px 10px 80px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    @media (min-width: 640px) {
      #app-root {
        padding: 20px 16px 96px;
      }
    }

    .app-shell {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .surface-main {
      flex: 1;
      background: linear-gradient(135deg, rgba(15,23,42,0.88), rgba(15,23,42,0.92));
      border-radius: var(--radius-xl);
      border: 1px solid rgba(148,163,184,0.5);
      box-shadow: var(--shadow-deep);
      padding: 14px 14px 18px;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(var(--blur-strong));
      position: relative;
      overflow: hidden;
    }

    [data-theme="light"] .surface-main {
      background: linear-gradient(135deg, rgba(255,255,255,0.96), rgba(248,250,252,0.98));
    }

    .surface-main::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at top left, rgba(56,189,248,0.22), transparent 60%),
        radial-gradient(circle at top right, rgba(244,114,182,0.18), transparent 55%),
        radial-gradient(circle at bottom, rgba(52,211,153,0.16), transparent 60%);
      opacity: 0.9;
      pointer-events: none;
    }

    .surface-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .surface-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      gap: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      border-radius: 999px;
      background:
        conic-gradient(from 220deg, #06b6d4 0deg, #22c55e 120deg, #eab308 220deg, #ec4899 320deg, #06b6d4 360deg);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 0 0 2px rgba(15,23,42,1),
        0 18px 40px rgba(34,197,94,0.85);
      position: relative;
      overflow: hidden;
    }

    .brand-logo-inner {
      width: 26px;
      height: 26px;
      border-radius: inherit;
      background: radial-gradient(circle at 30% 20%, #e0f2fe, #020617 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 11px;
      color: #e5e7eb;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .brand-text-main {
      font-size: 1.02rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-text-main span:last-child {
      font-size: 0.7rem;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(56,189,248,0.14);
      color: #7dd3fc;
      border: 1px solid rgba(56,189,248,0.4);
    }

    [data-theme="light"] .brand-text-main span:last-child {
      background: rgba(56,189,248,0.12);
      color: #0369a1;
    }

    .brand-text-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .btn-icon {
      border: none;
      border-radius: 999px;
      padding: 6px 8px;
      background: radial-gradient(circle at 20% 0%, rgba(248,250,252,0.3), transparent 60%);
      background-color: rgba(15,23,42,0.85);
      color: var(--text-soft);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow:
        0 0 0 1px rgba(148,163,184,0.7),
        0 10px 28px rgba(15,23,42,0.9);
      backdrop-filter: blur(14px);
      font-size: 0.75rem;
      transition:
        background var(--transition-fast),
        transform var(--transition-fast),
        box-shadow var(--transition-fast),
        color var(--transition-fast);
    }

    [data-theme="light"] .btn-icon {
      background-color: rgba(255,255,255,0.96);
    }

    .btn-icon span:first-child {
      font-size: 1rem;
      transform: translateY(-1px);
    }

    .btn-icon:active {
      transform: translateY(1px) scale(0.97);
      box-shadow:
        0 0 0 1px rgba(148,163,184,0.8),
        0 6px 18px rgba(15,23,42,0.95);
    }

    .header-sub {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .header-sub-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chip-glass {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(15,23,42,0.95), rgba(15,23,42,0.85));
      border: 1px solid rgba(148,163,184,0.7);
      color: var(--text-muted);
      font-size: 0.72rem;
      box-shadow: 0 12px 30px rgba(15,23,42,0.85);
      backdrop-filter: blur(18px);
    }

    [data-theme="light"] .chip-glass {
      background: linear-gradient(135deg, rgba(255,255,255,0.98), rgba(248,250,252,0.96));
    }

    .chip-glass-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--accent-green);
      box-shadow: 0 0 0 4px rgba(34,197,94,0.35);
    }

    .chip-glass-warning {
      border-color: rgba(248,250,252,0.9);
      background: linear-gradient(135deg, rgba(127,29,29,0.94), rgba(153,27,27,0.96));
      color: #fed7d7;
    }

    [data-theme="light"] .chip-glass-warning {
      background: linear-gradient(135deg, rgba(254,226,226,0.98), rgba(254,226,226,0.96));
      color: #b91c1c;
      border-color: rgba(254,202,202,0.9);
    }

    .chip-glass-warning .chip-glass-dot {
      background: var(--accent-orange);
      box-shadow: 0 0 0 4px rgba(248,250,252,0.4);
    }

    .badge-date {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px 4px 6px;
      border-radius: 999px;
      background: rgba(15,23,42,0.85);
      color: var(--text-soft);
      font-size: 0.74rem;
      border: 1px solid rgba(148,163,184,0.7);
      backdrop-filter: blur(14px);
    }

    [data-theme="light"] .badge-date {
      background: rgba(255,255,255,0.96);
    }

    .badge-date-icon {
      width: 18px;
      height: 18px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 20%, #38bdf8, #0f172a 70%);
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      box-shadow: 0 0 0 1px rgba(15,23,42,0.8);
    }

    .section-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 4px 1px 4px;
      scrollbar-width: thin;
      scrollbar-color: rgba(148,163,184,0.8) rgba(15,23,42,0.2);
    }

    .section-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .section-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .section-scroll::-webkit-scrollbar-thumb {
      background: rgba(148,163,184,0.8);
      border-radius: 999px;
    }

    .block {
      background: linear-gradient(135deg, rgba(15,23,42,0.92), rgba(15,23,42,0.86));
      border-radius: var(--radius-lg);
      border: 1px solid rgba(148,163,184,0.55);
      box-shadow: var(--shadow-soft);
      padding: 12px 12px 12px;
      margin-bottom: 10px;
      backdrop-filter: blur(var(--blur-soft));
    }

    [data-theme="light"] .block {
      background: linear-gradient(135deg, rgba(255,255,255,0.98), rgba(248,250,252,0.98));
    }

    .block-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .block-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.94rem;
      font-weight: 500;
    }

    .block-title-icon {
      width: 20px;
      height: 20px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 20%, rgba(56,189,248,0.9), rgba(15,23,42,1));
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      box-shadow: 0 0 0 1px rgba(15,23,42,0.9);
    }

    .badge-soft {
      font-size: 0.70rem;
      padding: 4px 9px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.7);
      background: rgba(15,23,42,0.9);
      color: var(--text-muted);
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    [data-theme="light"] .badge-soft {
      background: rgba(255,255,255,0.98);
    }

    .badge-soft-accent {
      border-color: rgba(56,189,248,0.9);
      background: linear-gradient(135deg, rgba(56,189,248,0.16), rgba(56,189,248,0.08));
      color: #7dd3fc;
    }

    [data-theme="light"] .badge-soft-accent {
      color: #0369a1;
    }

    .badge-soft-danger {
      border-color: rgba(248,113,113,0.95);
      background: linear-gradient(135deg, rgba(127,29,29,0.95), rgba(153,27,27,0.98));
      color: #fecaca;
    }

    [data-theme="light"] .badge-soft-danger {
      background: rgba(254,226,226,0.98);
      color: #b91c1c;
    }

    .grid-two {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
      gap: 10px;
      margin-top: 2px;
    }

    @media (max-width: 420px) {
      .grid-two {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    .countdown-card {
      border-radius: var(--radius-lg);
      padding: 10px 10px 12px;
      background: radial-gradient(circle at top left, rgba(56,189,248,0.24), transparent 65%),
                  radial-gradient(circle at bottom right, rgba(34,197,94,0.18), transparent 65%),
                  rgba(15,23,42,0.96);
      border: 1px solid rgba(148,163,184,0.7);
      box-shadow: 0 16px 40px rgba(15,23,42,0.96);
      backdrop-filter: blur(20px);
    }

    [data-theme="light"] .countdown-card {
      background: radial-gradient(circle at top left, rgba(56,189,248,0.18), transparent 65%),
                  radial-gradient(circle at bottom right, rgba(34,197,94,0.12), transparent 65%),
                  rgba(255,255,255,0.98);
    }

    .countdown-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 8px;
    }

    .countdown-main {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .countdown-number {
      font-size: 2.1rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      background: linear-gradient(135deg, #e0f2fe, #a5b4fc, #fbcfe8);
      -webkit-background-clip: text;
      color: transparent;
    }

    .countdown-label {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .countdown-secondary {
      font-size: 0.80rem;
      color: var(--text-soft);
      margin-top: 3px;
    }

    .status-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 9px;
      border-radius: 999px;
      background: rgba(15,23,42,0.9);
      border: 1px solid rgba(148,163,184,0.7);
      color: var(--text-soft);
      font-size: 0.72rem;
    }

    [data-theme="light"] .status-tag {
      background: rgba(255,255,255,0.98);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--accent-green);
    }
    .status-dot-warn {
      background: var(--accent-orange);
    }

    .progress-shell {
      border-radius: 999px;
      padding: 2px;
      background: linear-gradient(90deg, rgba(15,23,42,0.9), rgba(15,23,42,0.9));
      border: 1px solid rgba(31,41,55,0.9);
      margin-top: 4px;
    }

    [data-theme="light"] .progress-shell {
      background: rgba(243,244,246,0.95);
      border-color: rgba(209,213,219,1);
    }

    .progress-inner {
      border-radius: inherit;
      height: 8px;
      background: linear-gradient(90deg, #22c55e, #a3e635, #67e8f9);
      width: 0%;
      transition: width 0.3s ease-out;
    }

    .row-space {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-top: 4px;
      flex-wrap: wrap;
    }

    .txt-muted {
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    .btn-chic {
      border: none;
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 0.78rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      background: linear-gradient(135deg, #22c55e, #0ea5e9);
      color: #020617;
      box-shadow: 0 12px 30px rgba(8,47,73,0.95);
      transition:
        transform var(--transition-fast),
        box-shadow var(--transition-fast),
        filter var(--transition-fast);
    }

    .btn-chic span:first-child {
      font-size: 0.95rem;
    }

    .btn-chic:active {
      transform: translateY(1px) scale(0.98);
      box-shadow: 0 6px 16px rgba(8,47,73,1);
    }

    .btn-chic-ghost {
      background: rgba(15,23,42,0.94);
      color: var(--text-soft);
      box-shadow: 0 10px 26px rgba(15,23,42,0.96);
      border: 1px solid rgba(148,163,184,0.75);
    }

    [data-theme="light"] .btn-chic-ghost {
      background: rgba(255,255,255,0.98);
    }

    .list-compact {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-top: 2px;
    }

    .pill-task {
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, rgba(15,23,42,0.96), rgba(15,23,42,0.92));
      border: 1px solid rgba(148,163,184,0.65);
      padding: 7px 9px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      transition:
        transform var(--transition-fast),
        box-shadow var(--transition-fast),
        border-color var(--transition-fast),
        background var(--transition-fast);
      box-shadow: 0 12px 30px rgba(15,23,42,0.9);
    }

    [data-theme="light"] .pill-task {
      background: linear-gradient(135deg, rgba(255,255,255,0.98), rgba(248,250,252,0.98));
    }

    .pill-task:hover {
      transform: translateY(-1px);
      border-color: rgba(56,189,248,0.9);
      box-shadow: 0 14px 36px rgba(8,47,73,0.95);
    }

    .pill-task-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .pill-task-title {
      font-size: 0.82rem;
      font-weight: 500;
    }

    .pill-task-meta {
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    .pill-task-meta strong {
      color: var(--accent-cyan);
    }

    .pill-task-chevron {
      font-size: 0.95rem;
      color: var(--accent-lime);
      align-self: center;
    }

    .help-text {
      font-size: 0.76rem;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .timeline-filter-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .segmented {
      display: inline-flex;
      padding: 3px;
      border-radius: 999px;
      background: rgba(15,23,42,0.95);
      border: 1px solid rgba(148,163,184,0.8);
      box-shadow: 0 14px 36px rgba(15,23,42,0.98);
      backdrop-filter: blur(16px);
    }

    [data-theme="light"] .segmented {
      background: rgba(255,255,255,0.98);
    }

    .segmented button {
      border: none;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.74rem;
      color: var(--text-muted);
      background: transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-width: 60px;
      justify-content: center;
      transition:
        background var(--transition-fast),
        color var(--transition-fast),
        transform var(--transition-fast),
        box-shadow var(--transition-fast);
    }

    .segmented button span:first-child {
      font-size: 0.8rem;
    }

    .segmented button.active {
      background: linear-gradient(135deg, #06b6d4, #22c55e);
      color: #020617;
      box-shadow: 0 12px 30px rgba(8,47,73,1);
      font-weight: 500;
      transform: translateY(-1px);
    }

    .segmented button:active {
      transform: translateY(0);
      box-shadow: 0 6px 18px rgba(8,47,73,1);
    }

    .timeline-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .task-card {
      border-radius: 18px;
      padding: 8px 9px 8px;
      background: linear-gradient(135deg, rgba(15,23,42,0.96), rgba(15,23,42,0.90));
      border: 1px solid rgba(148,163,184,0.7);
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 8px;
      font-size: 0.8rem;
      box-shadow: 0 16px 40px rgba(15,23,42,0.98);
      backdrop-filter: blur(16px);
      position: relative;
    }

    [data-theme="light"] .task-card {
      background: linear-gradient(135deg, rgba(255,255,255,0.98), rgba(248,250,252,0.98));
    }

    .task-phase {
      font-size: 0.76rem;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-top: 2px;
    }

    .task-phase-pill {
      padding: 3px 8px;

<body>
<div class="orb orb--cyan"></div>
<div class="orb orb--pink"></div>
<div class="orb orb--lime"></div>

<div id="app-root" data-theme="dark"></div>

<dialog id="note-dialog">
  <form method="dialog">
    <h2 class="modal-title">Notiz zur Aufgabe</h2>
    <div class="modal-body">
      <label for="note-text" class="input-label">Kurze Notiz (z.B. „Unterlagen vom Hausarzt anfordern“)</label>
      <textarea id="note-text" class="input-field" rows="3"></textarea>
      <p class="small" style="margin-top:4px;">
        Hinweis: Notizen werden nur lokal auf diesem Gerät gespeichert.
      </p>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn-secondary" onclick="window.SurgeryPrep?.closeNoteDialog(false)">Abbrechen</button>
      <button type="submit" class="btn-primary" onclick="window.SurgeryPrep?.closeNoteDialog(true)">Speichern</button>
    </div>
  </form>
</dialog>

<div id="print-view" class="print-view"></div>

<script>
(function () {
  const storageKeyProfile = 'surgeryPrep.userProfile.v1';
  const storageKeyTasks = 'surgeryPrep.tasks.v1';
  const storageKeySettings = 'surgeryPrep.settings.v1';
  const storageKeyPack = 'surgeryPrep.packlist.v1';

  const state = {
    userProfile: {
      opDate: '',
      opType: 'general',
      hospitalName: '',
      hospitalPhone: '',
      emergencyContact: '',
      wantsReminders: false,
      disclaimerAccepted: false,
      privacyAccepted: false
    },
    tasks: [],
    settings: {
      theme: 'dark',
      timelineFilter: 'all',
      activeTab: 'dashboard',
      infoTab: 'procedure',
      onboardingStep: 1
    },
    packList: {},
    lastNoteTaskId: null
  };

  function loadState() {
    try {
      const profileRaw = localStorage.getItem(storageKeyProfile);
      if (profileRaw) Object.assign(state.userProfile, JSON.parse(profileRaw));
      const tasksRaw = localStorage.getItem(storageKeyTasks);
      if (tasksRaw) state.tasks = JSON.parse(tasksRaw);
      const settingsRaw = localStorage.getItem(storageKeySettings);
      if (settingsRaw) Object.assign(state.settings, JSON.parse(settingsRaw));
      const packRaw = localStorage.getItem(storageKeyPack);
      if (packRaw) state.packList = JSON.parse(packRaw);
    } catch (e) {
      console.error('Fehler beim Laden', e);
    }
  }

  function saveProfile() {
    localStorage.setItem(storageKeyProfile, JSON.stringify(state.userProfile));
  }
  function saveTasks() {
    localStorage.setItem(storageKeyTasks, JSON.stringify(state.tasks));
  }
  function saveSettings() {
    localStorage.setItem(storageKeySettings, JSON.stringify(state.settings));
  }
  function savePackList() {
    localStorage.setItem(storageKeyPack, JSON.stringify(state.packList));
  }

  if (!Date.prototype.toLocalISODate) {
    Date.prototype.toLocalISODate = function () {
      const off = this.getTimezoneOffset();
      const d = new Date(this.getTime() - off * 60 * 1000);
      return d.toISOString().slice(0, 10);
    };
  }

  function daysBetween(aIso, bIso) {
    if (!aIso || !bIso) return null;
    const a = new Date(aIso + 'T00:00:00');
    const b = new Date(bIso + 'T00:00:00');
    return Math.round((b - a) / (1000 * 60 * 60 * 24));
  }

  function getOpSpecificTasks() {
    return {
      general: [
        {
          id: 'gen-d-3-support',
          phase: 'D-3',
          daysOffset: -3,
          title: 'Unterstützung organisieren',
          description: 'Überlegen Sie, wer Ihnen nach der OP im Alltag helfen kann (z.B. Einkäufe, Haushalt).',
          isDone: false,
          note: ''
        },
        {
          id: 'gen-d+3-pain',
          phase: 'D+3',
          daysOffset: 3,
          title: 'Schmerzverlauf beobachten',
          description: 'Achten Sie darauf, ob die Schmerzen eher weniger werden. Bei zunehmenden Schmerzen kontaktieren Sie Ihr Behandlungsteam.',
          isDone: false,
          note: ''
        }
      ],
      knee: [
        {
          id: 'knee-d-7-home',
          phase: 'D-7',
          daysOffset: -7,
          title: 'Wohnbereich anpassen',
          description: 'Räumen Sie Stolperfallen weg und bereiten Sie einen gut erreichbaren Ruheplatz vor.',
          isDone: false,
          note: ''
        },
        {
          id: 'knee-d+1-mobility',
          phase: 'D+1',
          daysOffset: 1,
          title: 'Bewegung nach Anweisung',
          description: 'Bewegen Sie das Bein nur so, wie es das Behandlungsteam empfohlen hat.',
          isDone: false,
          note: ''
        },
        {
          id: 'knee-d+7-physio',
          phase: 'D+7',

    ];

    const extras = getOpSpecificTasks()[opType] || getOpSpecificTasks().general;
    const template = base.concat(extras);

    const todayIso = new Date().toLocalISODate();
    const opDate = state.userProfile.opDate || todayIso;
    const tasks = template.map(t => {
      const d = new Date(opDate + 'T00:00:00');
      d.setDate(d.getDate() + t.daysOffset);
      return { ...t, dueDate: d.toLocalISODate() };
    });

    tasks.sort((a, b) => {
      const da = new Date(a.dueDate);

      if (da - db !== 0) return da - db;
      if (a.daysOffset !== b.daysOffset) return a.daysOffset - b.daysOffset;

    return tasks;

  function saveTaskNote(id, note) {
    const idx = state.tasks.findIndex(t => t.id === id);
    if (idx >= 0) {
      state.tasks[idx].note = note;
      saveTasks();
    }
  }

  function toggleTaskDone(id) {
    const idx = state.tasks.findIndex(t => t.id === id);
    if (idx >= 0) {
      state.tasks[idx].isDone = !state.tasks[idx].isDone;
      saveTasks();
      render();
    }
  }

  function togglePackItem(key) {
    if (!state.packList[key]) return;
    state.packList[key].checked = !state.packList[key].checked;
    savePackList();
    render();
  }

    localStorage.removeItem(storageKeyProfile);

    state.userProfile = {

  function syncTheme() {
    const root = document.getElementById('app-root');
    root.setAttribute('data-theme', state.settings.theme === 'light' ? 'light' : 'dark');
  }

  function changeOpDate(newDate) {
    state.userProfile.opDate = newDate;
    saveProfile();
    if (newDate) {
      const oldTasks = state.tasks;
      const newTemplate = buildTimelineTemplate(state.userProfile.opType);
      const merged = newTemplate.map(nt => {
        const ex = oldTasks.find(o => o.id === nt.id);
        return ex ? { ...nt, isDone: ex.isDone, note: ex.note } : nt;
      });
      state.tasks = merged;
      saveTasks();
    }
    render();
  }

  function changeOpType(newType) {
    state.userProfile.opType = newType;
    saveProfile();
    if (state.userProfile.opDate) {
      const oldTasks = state.tasks;
      const newTemplate = buildTimelineTemplate(newType);
      const merged = newTemplate.map(nt => {
        const ex = oldTasks.find(o => o.id === nt.id);
        return ex ? { ...nt, isDone: ex.isDone, note: ex.note } : nt;
      });
      state.tasks = merged;
      saveTasks();
    }
    render();
  }

  function formatDateReadable(iso) {
    if (!iso) return '-';
    const d = new Date(iso + 'T00:00:00');
    const dd = String(d.getDate()).padStart(2, '0');
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const yy = d.getFullYear();
    return `${dd}.${mm}.${yy}`;
  }

  function formatRelativeDateLabel(iso) {
    const today = new Date().toLocalISODate();
    const diff = daysBetween(today, iso);
    if (diff === 0) return 'Heute';
    if (diff === 1) return 'Morgen';
    if (diff === -1) return 'Gestern';
    if (diff > 1) return `In ${diff} Tagen (${formatDateReadable(iso)})`;
    return `Vor ${Math.abs(diff)} Tagen (${formatDateReadable(iso)})`;
  }

  function getUpcomingTasks() {
    const today = new Date().toLocalISODate();
    const open = state.tasks.filter(t => {
      const diff = daysBetween(today, t.dueDate);
      return diff !== null && diff >= 0 && !t.isDone;
    });
    open.sort((a, b) => {
      const da = new Date(a.dueDate);
      const db = new Date(b.dueDate);
      if (da - db !== 0) return da - db;
      return a.title.localeCompare(b.title, 'de');
    });
    return open.slice(0, 3);
  }

  function render() {
    const root = document.getElementById('app-root');
    syncTheme();

    if (!state.userProfile.opDate || !state.userProfile.disclaimerAccepted || !state.userProfile.privacyAccepted) {
      root.innerHTML = renderOnboarding();
      attachOnboardingHandlers();
      return;
    }

    if (!Object.keys(state.packList).length) {
      buildPackListDefaults();
    }

    root.innerHTML = renderAppShell();
    attachAppHandlers();
  }

              <div class="input-row">
                <label for="onb-hospital" class="input-label">Krankenhaus / Praxis (optional)</label>
                <input id="onb-hospital" class="input-field" type="text" placeholder="Name oder Ort" value="${state.userProfile.hospitalName || ''}">
              </div>
              <div class="input-row">
                <label for="onb-phone" class="input-label">Telefonnummer Klinik (optional)</label>
                <input id="onb-phone" class="input-field" type="tel" placeholder="z.B. 01234 56789" value="${state.userProfile.hospitalPhone || ''}">
              </div>
              <div class="input-row">
                <label for="onb-emergency" class="input-label">Notfallkontakt (Name/Telefon, optional)</label>
                <input id="onb-emergency" class="input-field" type="text" placeholder="z.B. Partner, Eltern" value="${state.userProfile.emergencyContact || ''}">
              </div>
              <div class="input-inline">
                <input type="checkbox" id="onb-reminders" class="input-checkbox" ${state.userProfile.wantsReminders ? 'checked' : ''}>
                <label for="onb-reminders">Ich möchte an Aufgaben erinnert werden (wenn im Browser möglich).</label>
              </div>
              <p class="small">
                Hinweis: Die Erinnerungsfunktion arbeitet nur auf diesem Gerät. Es werden keine Daten an einen Server gesendet.
              </p>
            </div>
            <div class="onboard-actions">
              <button class="btn-primary" id="btn-onb-3-finish">
                Start · Zum Dashboard
              </button>
              <button class="btn-secondary" id="btn-onb-3-back">
                Zurück
              </button>
            </div>
          </div>
        </section>
      `;
    }
  }

  function attachOnboardingHandlers() {
    const root = document.getElementById('app-root');
    const step = state.settings.onboardingStep || 1;
    if (step === 1) {
      root.querySelector('#btn-onb-1-next')?.addEventListener('click', () => {
        state.settings.onboardingStep = 2;
        saveSettings();
        render();
      });
    } else if (step === 2) {
      const chkDisclaimer = root.querySelector('#chk-disclaimer');
      const chkPrivacy = root.querySelector('#chk-privacy');
      const btnNext = root.querySelector('#btn-onb-2-next');
      const btnBack = root.querySelector('#btn-onb-2-back');

      const updateNext = () => {
        const ready = chkDisclaimer.checked && chkPrivacy.checked;
        btnNext.disabled = !ready;
        if (!ready) {
          btnNext.style.opacity = '0.55';
          btnNext.style.cursor = 'not-allowed';
        } else {
          btnNext.style.opacity = '1';
          btnNext.style.cursor = 'pointer';
        }
      };

      chkDisclaimer?.addEventListener('change', () => {
        state.userProfile.disclaimerAccepted = chkDisclaimer.checked;
        saveProfile();
        updateNext();
      });
      chkPrivacy?.addEventListener('change', () => {
        state.userProfile.privacyAccepted = chkPrivacy.checked;
        saveProfile();
        updateNext();
      });
      btnNext?.addEventListener('click', () => {
        if (!chkDisclaimer.checked || !chkPrivacy.checked) return;
        state.settings.onboardingStep = 3;
        saveSettings();
        render();
      });
      btnBack?.addEventListener('click', () => {
        state.settings.onboardingStep = 1;
        saveSettings();
        render();
      });
    } else {
      const inputDate = root.querySelector('#onb-op-date');
      const inputType = root.querySelector('#onb-op-type');
      const inputHospital = root.querySelector('#onb-hospital');
      const inputPhone = root.querySelector('#onb-phone');
      const inputEmergency = root.querySelector('#onb-emergency');
      const chkRem = root.querySelector('#onb-reminders');
      const btnFinish = root.querySelector('#btn-onb-3-finish');
      const btnBack = root.querySelector('#btn-onb-3-back');

      btnFinish?.addEventListener('click', () => {
        state.userProfile.opDate = inputDate.value;
        state.userProfile.opType = inputType.value;
        state.userProfile.hospitalName = inputHospital.value.trim();
        state.userProfile.hospitalPhone = inputPhone.value.trim();
        state.userProfile.emergencyContact = inputEmergency.value.trim();
        state.userProfile.wantsReminders = chkRem.checked;
        saveProfile();

        if (!state.userProfile.opDate) {
          alert('Bitte ein OP-Datum eingeben, damit die Timeline berechnet werden kann.');
          return;
        }

        state.tasks = buildTimelineTemplate(state.userProfile.opType);
        saveTasks();
        state.settings.activeTab = 'dashboard';
        saveSettings();
        render();
      });

      btnBack?.addEventListener('click', () => {
        state.settings.onboardingStep = 2;
        saveSettings();
        render();
      });
    }
  }

  function renderAppShell() {
    const opDate = state.userProfile.opDate;
    const today = new Date().toLocalISODate();
    const diff = daysBetween(today, opDate);
    const info = getInfoContent()[state.userProfile.opType] || getInfoContent().general;

    let countdownLabel = '';
    let statusTagHtml = '';
    if (diff === null) {
      countdownLabel = 'Bitte OP-Datum eingeben.';
      statusTagHtml = `<div class="status-tag"><span class="status-dot status-dot-warn"></span><span>Datum fehlt</span></div>`;
    } else if (diff > 0) {
      countdownLabel = `Noch ${diff} Tag${diff === 1 ? '' : 'e'} bis zur OP.`;
      statusTagHtml = `<div class="status-tag"><span class="status-dot"></span><span>In Vorbereitung</span></div>`;
    } else if (diff === 0) {
      countdownLabel = 'Heute ist Ihr OP-Tag.';
      statusTagHtml = `<div class="status-tag"><span class="status-dot status-dot-warn"></span><span>Heute</span></div>`;
    } else {
      countdownLabel = `Die OP liegt ${Math.abs(diff)} Tag${Math.abs(diff) === 1 ? '' : 'e'} zurück.`;
      statusTagHtml = `<div class="status-tag"><span class="status-dot status-dot-warn"></span><span>Nach der OP</span></div>`;
    }

    const upcoming = getUpcomingTasks();
    const completedCount = state.tasks.filter(t => t.isDone).length;
    const totalCount = state.tasks.length;
    const progress = totalCount ? Math.round((completedCount / totalCount) * 100) : 0;

    let nextTasksHtml = '';
    if (!upcoming.length) {
      nextTasksHtml = `<li class="txt-muted">Keine offenen Aufgaben in den nächsten Tagen. Schauen Sie in der Timeline nach weiteren Punkten.</li>`;
    } else {
      nextTasksHtml = upcoming.map(t => `
        <li class="pill-task" data-open-tab="timeline">
          <div class="pill-task-main">
            <div class="pill-task-title">${t.title}</div>
            <div class="pill-task-meta">
              <strong>${formatRelativeDateLabel(t.dueDate)}</strong> · ${t.description}
            </div>
          </div>
          <div class="pill-task-chevron" aria-hidden="true">${t.isDone ? '✓' : '›'}</div>
        </li>
      `).join('');
    }

    return `
      <div class="app-shell" aria-label="SurgeryPrep App">
        <section class="surface-main">
          <div class="surface-content">
            <header class="surface-header">
              <div class="brand">
                <div class="brand-logo">
                  <div class="brand-logo-inner">SP</div>
                </div>
                <div>
                  <div class="brand-text-main">
                    <span>SurgeryPrep</span>
                    <span>Beta</span>
                  </div>
                  <div class="brand-text-sub">
                    OP-Vorbereitung, klar und verständlich
                  </div>
                </div>
              </div>
              <button class="btn-icon" id="btn-theme-toggle" aria-label="Darstellung wechseln (hell/dunkel)">
                <span>${state.settings.theme === 'light' ? '🌙' : '☀️'}</span>
                <span>${state.settings.theme === 'light' ? 'Dunkel' : 'Hell'}</span>
              </button>
            </header>

            <div class="header-sub">
              <div class="header-sub-left">
                <div class="badge-date" aria-label="OP-Datum">
                  <div class="badge-date-icon">📅</div>
                  <span>${opDate ? `OP am ${formatDateReadable(opDate)}` : 'OP-Datum noch nicht gesetzt'}</span>
                </div>
                ${statusTagHtml}
              </div>
              <div class="chip-glass chip-glass-warning">
                <span class="chip-glass-dot"></span>
                <span>Infos ersetzen keine ärztliche Beratung</span>
              </div>
            </div>

            <main class="section-scroll" aria-live="polite">
              ${renderActiveTab({
                diff,
                countdownLabel,
                infoLabel: info.label,
                upcomingHtml: nextTasksHtml,
                progress,
                completedCount,
                totalCount
              })}
            </main>
          </div>
        </section>
      </div>

      <nav class="bottom-nav-shell" aria-label="Hauptnavigation">
        <div class="bottom-nav">
          <button class="nav-btn ${state.settings.activeTab === 'dashboard' ? 'active' : ''}" data-tab="dashboard">
            <span class="nav-btn-icon">🏠</span>
            <span>Start</span>
          </button>
          <button class="nav-btn ${state.settings.activeTab === 'timeline' ? 'active' : ''}" data-tab="timeline">
            <span class="nav-btn-icon">✅</span>
            <span>Timeline</span>
          </button>
          <button class="nav-btn ${state.settings.activeTab === 'info' ? 'active' : ''}" data-tab="info">
            <span class="nav-btn-icon">📘</span>
            <span>OP-Infos</span>
          </button>
          <button class="nav-btn ${state.settings.activeTab === 'warn' ? 'active' : ''}" data-tab="warn">
            <span class="nav-btn-icon">⚠️</span>
            <span>Warn</span>
          </button>
          <button class="nav-btn ${state.settings.activeTab === 'docs' ? 'active' : ''}" data-tab="docs">
            <span class="nav-btn-icon">🧳</span>
            <span>Dok.</span>
          </button>
        </div>
      </nav>
    `;
  }

  function renderActiveTab(ctx) {
    switch (state.settings.activeTab) {
      case 'timeline':
        return renderTimelineTab();
      case 'info':
        return renderInfoTab();
      case 'warn':
        return renderWarnTab();
      case 'docs':
        return renderDocsTab();
      case 'settings':
        return renderSettingsTab();
      case 'dashboard':
      default:
        return renderDashboardTab(ctx);
    }
  }

  function renderDashboardTab({ diff, countdownLabel, infoLabel, upcomingHtml, progress, completedCount, totalCount }) {
    return `
      <section aria-label="Dashboard">
        <article class="block">
          <div class="block-header-row">
            <div class="block-title">
              <div class="block-title-icon">⏱</div>
              <span>Countdown zur OP</span>
            </div>
            <span class="badge-soft badge-soft-accent">${infoLabel}</span>
          </div>
          <div class="grid-two">
            <div class="countdown-card">
              <div class="countdown-row">
                <div class="countdown-main">
                  <div class="countdown-number">${diff === null ? '-' : Math.abs(diff)}</div>
                  <div>
                    <div class="countdown-label">
                      ${diff === null ? 'Tage' : diff === 0 ? 'heute' : diff > 0 ? 'Tage bis zur OP' : 'Tage seit der OP'}
                    </div>
                    <div class="countdown-secondary">${countdownLabel}</div>
                  </div>
                </div>
              </div>
            </div>
            <div>
              <p class="txt-muted">
                Hier sehen Sie, wie weit Sie mit Ihren Aufgaben sind. Die Timeline hilft Ihnen,
                Schritt für Schritt nichts Wichtiges zu vergessen.
              </p>
              <div class="progress-shell" aria-label="Fortschritt erledigter Aufgaben">
                <div class="progress-inner" style="width:${progress}%"></div>
              </div>
              <div class="row-space">
                <span class="txt-muted">${completedCount} von ${totalCount} Aufgaben erledigt</span>
                <button class="btn-chic-ghost" data-open-tab="timeline">
                  <span>✅</span>
                  <span>Zur Timeline</span>
                </button>
              </div>
            </div>
          </div>
        </article>

        <article class="block">
          <div class="block-header-row">
            <div class="block-title">
              <div class="block-title-icon">📝</div>
              <span>Nächste Schritte</span>
            </div>
            <span class="badge-soft badge-soft-accent">Top 3 Aufgaben</span>
          </div>
          <ul class="list-compact">
            ${upcomingHtml}
          </ul>
          <p class="help-text">
            Tipp: In der Timeline können Sie Aufgaben abhaken und eigene Notizen hinterlegen,
            zum Beispiel Telefonate oder Rückfragen.
          </p>
        </article>

        <article class="block">
          <div class="block-header-row">
            <div class="block-title">
              <div class="block-title-icon">💡</div>
              <span>Wie nutze ich die Timeline?</span>
            </div>
            <span class="badge-soft">Kurz erklärt</span>
          </div>
          <div class="tab-content">
            <ul class="bullets">
              <li>Die Aufgaben sind entlang Ihres OP-Datums sortiert (D-14 bis D+7).</li>
              <li>Setzen Sie ein Häkchen, wenn Sie einen Punkt erledigt haben.</li>
              <li>Über „Notiz hinzufügen“ können Sie persönliche Erinnerungen speichern.</li>
              <li>Wenn sich Ihr OP-Termin verschiebt, passen Sie das Datum in den Einstellungen an.</li>
            </ul>
            <p class="help-text">
              Wichtig: Diese App ergänzt nur die Unterlagen Ihrer Klinik und ersetzt diese nicht.
            </p>
          </div>
        </article>
      </section>
    `;
  }

  function renderTimelineTab() {
    const filter = state.settings.timelineFilter || 'all';
    let tasks = [...state.tasks];
    if (filter === 'open') tasks = tasks.filter(t => !t.isDone);
    if (filter === 'done') tasks = tasks.filter(t => t.isDone);

    return `
      <section aria-label="Timeline & Checkliste">
        <article class="block">
          <div class="block-header-row">
            <div class="block-title">
              <div class="block-title-icon">✅</div>
              <span>Timeline zur OP</span>
            </div>
            <button class="btn-chic-ghost" id="btn-change-opdate">
              <span>🗓</span>
              <span>OP-Datum anpassen</span>
            </button>
          </div>
          <div class="timeline-filter-row">
            <div class="segmented" role="radiogroup" aria-label="Aufgabenfilter">
              <button type="button" class="${filter === 'all' ? 'active' : ''}" data-filter="all">
                <span>●</span><span>Alle</span>
              </button>
              <button type="button" class="${filter === 'open' ? 'active' : ''}" data-filter="open">
                <span>○</span><span>Offen</span>
              </button>
              <button type="button" class="${filter === 'done' ? 'active' : ''}" data-filter="done">
                <span>✓</span><span>Erledigt</span>
              </button>
            </div>
            <span class="txt-muted">Aufgaben insgesamt: ${state.tasks.length}</span>
          </div>
          <ul class="timeline-list">
            ${tasks.map(renderTaskCard).join('')}
          </ul>
          <p class="help-text">
            Hinweis: Die Timeline ist allgemein gehalten. Halten Sie sich immer zusätzlich an den individuellen Plan Ihrer Klinik.
          </p>
        </article>
      </section>
    `;
  }

  function renderTaskCard(task) {
    const today = new Date().toLocalISODate();
    const diff = daysBetween(today, task.dueDate);
    const label = diff === 0 ? 'Heute' : diff > 0 ? `In ${diff} Tag${diff === 1 ? '' : 'en'}` : `Vor ${Math.abs(diff)} Tag${Math.abs(diff) === 1 ? '' : 'en'}`;
    return `
      <li class="task-card" data-task-id="${task.id}">
        <div class="task-phase">
          <span class="task-phase-pill">${task.phase}</span>
          <span>${formatRelativeDateLabel(task.dueDate)}</span>
        </div>
        <div class="task-main">
          <div class="task-main-header">
            <div class="task-main-title">${task.title}</div>
            <label class="toggle-pill">
              <input type="checkbox" ${task.isDone ? 'checked' : ''} data-task-toggle="${task.id}">
              erledigt
            </label>
          </div>
          <div class="task-main-desc">${task.description}</div>
          <div class="task-main-footer">
            <div class="task-actions">
              <button class="btn-link" type="button" data-task-note="${task.id}">
                ${task.note ? 'Notiz bearbeiten' : 'Notiz hinzufügen'}
              </button
